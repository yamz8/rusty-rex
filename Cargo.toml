[package]
name = "rusty-rex"
version = "1.8.0"
edition = "2024"
description = "The offline dinosaur runner, in Rust"
license = "MIT"

[dependencies]
# The window, input and GL layer. The game draws only flat shapes, so it
# renders on miniquad itself (src/gfx.rs) rather than through macroquad,
# which sets up font atlases, UI and shaders at start that go unused.
miniquad = { version = "0.4.11", features = ["log-impl"] }
# Started only for a game with sound, never for the silent screensaver.
quad-snd = "0.2.8"
# dlopen and dlsym, to find glReleaseShaderCompiler in the GL library
# miniquad already loaded. Miniquad depends on it anyway.
libc = "0.2.191"

[profile.release]
lto = true
strip = true
# One codegen unit lets LLVM optimise across the whole crate at once.
codegen-units = 1
# Nothing catches panics, so unwinding tables are dead weight.
panic = "abort"

[package]
name = "rusty-rex"
version = "1.4.1"
edition = "2024"
description = "The offline dinosaur runner, in Rust"
license = "MIT"

[dependencies]
macroquad = "0.4.16"
# Used directly rather than through macroquad's audio feature, which starts
# the audio thread with every window, even the silent screensaver's.
quad-snd = "0.2.8"

[profile.release]
lto = true
strip = true
# One codegen unit lets LLVM optimise across the whole crate at once.
codegen-units = 1
# Nothing catches panics, so unwinding tables are dead weight.
panic = "abort"
